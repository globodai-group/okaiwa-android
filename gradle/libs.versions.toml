[versions]
agp = "8.9.2"
kotlin = "2.3.21"
ksp = "2.3.7"
# Hilt 2.59+ requires AGP 9. Pinned to 2.56.2, the last release that
# still works on AGP 8.5 — bump together with AGP 9 + Gradle 9 in a
# coordinated toolchain upgrade sprint.
hilt = "2.59.2"
compose-bom = "2024.12.01"
compose-navigation = "2.9.8"
lifecycle = "2.10.0"
room = "2.8.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datastore = "1.2.1"
biometric = "1.4.0-alpha06"
firebase-bom = "33.7.0"
sqlcipher = "4.15.0"
activity-compose = "1.13.0"
core-ktx = "1.18.0"
# AppCompat — only pulled in for AppCompatDelegate.setApplicationLocales,
# which is the pre-T compatibility shim behind the in-app language picker
# (Android 13+ routes through the framework's LocaleManager on its own).
appcompat = "1.7.1"
google-services = "4.4.4"
credentials = "1.6.0"
# Signal Foundation libsignal — Signal Protocol (Curve25519 + Double Ratchet + PQXDH).
# 0.76.7 is the latest tagged release on Maven Central (org.signal:libsignal-android).
# Ships the JNI wrapper + libsignal_jni native .so for arm64-v8a, armeabi-v7a, x86_64.
libsignal = "0.86.5"
# Trust Wallet wallet-core — BIP-39 mnemonic + multi-chain HD derivation.
# Hosted on GitHub Packages (https://maven.pkg.github.com/trustwallet/wallet-core),
# NOT Maven Central — resolution requires a GITHUB_TOKEN with read:packages scope.
# See settings.gradle.kts for the repo declaration.
wallet-core = "4.3.5"
# D8 core library desugaring — backports java.time.* and other Java 8+ APIs
# so libsignal-android (which targets minSdk 26 but relies on Instant etc.)
# can run on the full minSdk = 26 surface through D8's synthesised stubs.
desugar = "2.1.5"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose-navigation" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

# Lifecycle
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.3.0" }

# Network
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

# Kotlin
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Room + SQLCipher
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# DataStore
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Biometric
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Security — EncryptedSharedPreferences for the session token store.
# The AndroidX Keystore-backed MasterKey wraps AES-256/GCM so the
# access + refresh tokens never hit disk in plaintext.
security-crypto = { group = "androidx.security", name = "security-crypto", version = "1.1.0" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# AndroidX Core
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

# AppCompat — exposes AppCompatDelegate.setApplicationLocales() so the
# in-app language picker can flip the locale on Android 12 and earlier
# without a full activity restart (Android 13+ uses framework APIs).
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Credential Manager (1Password / Dashlane / Google Password Manager)
credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# Signal Protocol — real Curve25519 identity keys, signed pre-keys, Double Ratchet + PQXDH sessions.
libsignal-android = { group = "org.signal", name = "libsignal-android", version.ref = "libsignal" }

# Trust Wallet wallet-core — BIP-39 mnemonic generation + multi-chain address derivation
# (BTC, ETH, SOL, …) sharing the same HD seed. Bundles .so files for 4 ABIs.
wallet-core = { group = "com.trustwallet", name = "wallet-core", version.ref = "wallet-core" }

# Core library desugaring runtime — required by libsignal-android.
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Testing
junit = { group = "junit", name = "junit", version = "4.13.2" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
